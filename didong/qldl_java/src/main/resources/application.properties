server.port=8080

# SQL Server Database Configuration (Database: QuanLyDLpro)
# Cách 1: Dùng tài khoản sa / SQL Server Authentication (Khuyên dùng cho Java)
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=QuanLyDLpro;encrypt=true;trustServerCertificate=true;integratedSecurity=false;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456

# Cách 2: Dùng Windows Authentication (Bỏ dấu # ở 2 dòng dưới nếu dùng Windows Auth)
# spring.datasource.url=jdbc:sqlserver://localhost;databaseName=QuanLyDLpro;encrypt=true;trustServerCertificate=true;integratedSecurity=true;
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate configuration for SQL Server
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Settings
spring.jackson.serialization.fail-on-empty-beans=false
